name: Apply public plugin slug

on:
  push:
    branches:
      - audit/plugin-check-wordpress-org

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/plugin-check-wordpress-org
      - name: Update public name, distribution slug and translation domain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          text_files = [
              p for p in root.rglob('*')
              if p.is_file()
              and '.git' not in p.parts
              and 'vendor' not in p.parts
              and 'build' not in p.parts
              and p.suffix.lower() in {'.php', '.js', '.json', '.txt', '.md', '.yml', '.yaml'}
          ]

          for path in text_files:
              text = path.read_text(encoding='utf-8')
              original = text

              text = text.replace('WP Piwigo Display', 'Piwigo Display')
              text = re.sub(r"([,\(]\s*)'wp-piwigo-display'(\s*\))", r"\1'piwigo-display'\2", text)
              text = re.sub(r'([,\(]\s*)"wp-piwigo-display"(\s*\))', r'\1"piwigo-display"\2', text)
              text = text.replace('Text Domain: wp-piwigo-display', 'Text Domain: piwigo-display')
              text = text.replace('"textdomain": "wp-piwigo-display"', '"textdomain": "piwigo-display"')

              if path.as_posix() == '.github/workflows/php-lint.yml':
                  text = text.replace('build/plugin-check/wp-piwigo-display', 'build/plugin-check/piwigo-display')
                  text = text.replace('mkdir -p build/wp-piwigo-display', 'mkdir -p build/piwigo-display')
                  text = text.replace('build/wp-piwigo-display/', 'build/piwigo-display/')
                  text = text.replace('wp-piwigo-display-${{ steps.version.outputs.version }}.zip', 'piwigo-display-${{ steps.version.outputs.version }}.zip')
                  text = text.replace('name: wp-piwigo-display-${{ steps.version.outputs.version }}', 'name: piwigo-display-${{ steps.version.outputs.version }}')
                  text = text.replace('path: build/wp-piwigo-display-${{ steps.version.outputs.version }}.zip', 'path: build/piwigo-display-${{ steps.version.outputs.version }}.zip')

              if text != original:
                  path.write_text(text, encoding='utf-8')
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: adopte le nom public Piwigo Display" || exit 0
          git rm .github/workflows/apply-public-slug.yml
          git commit -m "ci: retire la migration ponctuelle du slug"
          git push origin HEAD:audit/plugin-check-wordpress-org
