name: Cache query fix

on:
  push:
    branches:
      - refactor/cache-audit
    paths:
      - .github/workflows/cache-query-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/cache-audit
          fetch-depth: 0

      - name: Replace dynamic cache purge query
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('includes/class-wpd-cache.php')
          text = path.read_text()
          old = """\t\t$conditions          = array();
\t\t$values              = array();

\t\tforeach ( $patterns as $pattern ) {
\t\t\t$conditions[] = 'option_name LIKE %s';
\t\t\t$values[]     = $wpdb->esc_like( $pattern ) . '%';
\t\t}

\t\t// The table name and WHERE fragments are generated internally; values remain prepared.
\t\t$names = $wpdb->get_col( // phpcs:ignore WordPress.DB.DirectDatabaseQuery.DirectQuery, WordPress.DB.DirectDatabaseQuery.NoCaching
\t\t\t$wpdb->prepare( // phpcs:ignore WordPress.DB.PreparedSQL.NotPrepared, WordPress.DB.PreparedSQLPlaceholders.UnfinishedPrepare
\t\t\t\t'SELECT option_name FROM ' . $wpdb->options . ' WHERE ' . implode( ' OR ', $conditions ),
\t\t\t\t...$values
\t\t\t)
\t\t);
"""
          new = """\t\t$values = array_map(
\t\t\tstatic function ( string $pattern ) use ( $wpdb ): string {
\t\t\t\treturn $wpdb->esc_like( $pattern ) . '%';
\t\t\t},
\t\t\t$patterns
\t\t);

\t\t$query = $wpdb->prepare(
\t\t\t\"SELECT option_name FROM {$wpdb->options}
\t\t\tWHERE option_name LIKE %s
\t\t\tOR option_name LIKE %s
\t\t\tOR option_name LIKE %s
\t\t\tOR option_name LIKE %s
\t\t\tOR option_name LIKE %s
\t\t\tOR option_name LIKE %s\",
\t\t\t...$values
\t\t);

\t\t$names = $wpdb->get_col( $query ); // phpcs:ignore WordPress.DB.DirectDatabaseQuery.DirectQuery, WordPress.DB.DirectDatabaseQuery.NoCaching
"""
          if old not in text:
              raise SystemExit('Expected cache query block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/cache-query-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/class-wpd-cache.php .github/workflows/cache-query-fix.yml
          git commit -m "fix: prepare cache purge query explicitly"
          git push origin HEAD:refactor/cache-audit
