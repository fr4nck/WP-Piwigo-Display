name: Build plugin ZIP

on:
  pull_request:
  push:
    branches:
      - main
      - 2.0.x
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          VERSION=$(php -r '$c=file_get_contents("wp-piwigo-display.php"); preg_match("/Version:\\s*([^\\r\\n]+)/", $c, $m); echo trim($m[1] ?? "dev");')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare plugin directory
        run: |
          mkdir -p build/wp-piwigo-display
          rsync -a ./ build/wp-piwigo-display/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'build' \
            --exclude '*.zip'

      - name: Create ZIP
        run: |
          cd build
          zip -r "wp-piwigo-display-${{ steps.version.outputs.version }}.zip" wp-piwigo-display

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wp-piwigo-display-${{ steps.version.outputs.version }}
          path: build/wp-piwigo-display-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 14
