name: Fix service account alignment

on:
  push:
    branches:
      - refactor/service-account-audit
    paths:
      - .github/workflows/fix-service-account-alignment.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/service-account-audit
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpcbf --standard=phpcs.xml.dist includes/class-wpd-service-account.php || true
      - run: rm .github/workflows/fix-service-account-alignment.yml
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/class-wpd-service-account.php .github/workflows/fix-service-account-alignment.yml
          git commit -m "Aligne le tableau du compte de service"
          git push
