name: Fix service account alignment

on:
  push:
    branches:
      - refactor/service-account-audit
    paths:
      - .github/workflows/fix-service-account-alignment.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/service-account-audit
      - name: Fix exact alignment
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('includes/class-wpd-service-account.php')
          text = path.read_text()
          text = text.replace("'page'                    =>", "'page'                   =>")
          text = text.replace("'wpd_service_test'        =>", "'wpd_service_test'       =>")
          text = text.replace("'wpd_service_test_notice' =>", "'wpd_service_test_notice'=>")
          path.write_text(text)
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/fix-service-account-alignment.yml
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/class-wpd-service-account.php .github/workflows/fix-service-account-alignment.yml
          git commit -m "Style: aligne la redirection du compte de service"
          git push
