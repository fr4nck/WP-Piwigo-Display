name: Vendor Splide locally

on:
  push:
    branches:
      - audit/plugin-check-wordpress-org
    paths:
      - .github/workflows/vendor-splide.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/plugin-check-wordpress-org
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bundle Splide and update bootstrap
        run: |
          tmpdir=$(mktemp -d)
          npm install --prefix "$tmpdir" --ignore-scripts --no-audit --no-fund @splidejs/splide@4.1.4
          mkdir -p assets/vendor/splide
          cp "$tmpdir/node_modules/@splidejs/splide/dist/js/splide.min.js" assets/vendor/splide/splide.min.js
          cp "$tmpdir/node_modules/@splidejs/splide/dist/css/splide.min.css" assets/vendor/splide/splide.min.css
          python - <<'PY'
          from pathlib import Path
          path = Path('includes/class-wpd-plugin.php')
          text = path.read_text()
          text = text.replace("\t\tadd_action( 'init', array( $this, 'load_textdomain' ) );\n", '')
          start = text.find("\n\t/**\n\t * Loads the plugin text domain.")
          end = text.find("\n\t/**\n\t * Registers public shortcodes.", start)
          if start != -1 and end != -1:
              text = text[:start] + text[end:]
          text = text.replace("'https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css'", "WPD_PLUGIN_URL . 'assets/vendor/splide/splide.min.css'")
          text = text.replace("'https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js'", "WPD_PLUGIN_URL . 'assets/vendor/splide/splide.min.js'")
          path.write_text(text)
          PY
          rm .github/workflows/vendor-splide.yml
      - name: Commit bundled dependency
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vendor/splide includes/class-wpd-plugin.php .github/workflows/vendor-splide.yml
          git commit -m "WordPress.org: embarque Splide localement"
          git push
