name: Normalize service account

on:
  push:
    branches:
      - refactor/service-account-audit
    paths:
      - .github/workflows/normalize-service-account.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/service-account-audit
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpcbf --standard=phpcs.xml.dist includes/class-wpd-service-account.php || true
      - run: rm .github/workflows/normalize-service-account.yml
      - name: Commit normalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/class-wpd-service-account.php .github/workflows/normalize-service-account.yml
          git commit -m "Normalise la classe du compte de service"
          git push origin HEAD:refactor/service-account-audit
