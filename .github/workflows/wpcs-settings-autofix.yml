name: WPCS settings autofix

on:
  push:
    branches:
      - refactor/wpcs-settings
    paths:
      - .github/workflows/wpcs-settings-autofix.yml

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/wpcs-settings
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Install coding standards
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Fix settings coding standards
        run: vendor/bin/phpcbf --standard=phpcs.xml.dist includes/class-wpd-settings.php || test $? -eq 1

      - name: Remove temporary workflow
        run: rm .github/workflows/wpcs-settings-autofix.yml

      - name: Commit focused autofix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/class-wpd-settings.php .github/workflows/wpcs-settings-autofix.yml
          git diff --cached --quiet && exit 0
          git commit -m "style: apply WPCS fixes to settings"
          git push origin HEAD:refactor/wpcs-settings
