name: Build Piwigo Display package

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/**'
      - 'audit/**'
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/build-plugin.yml'
      - 'composer.json'
      - 'wp-piwigo-display.php'
      - 'includes/**'
      - 'assets/**'
      - 'blocks/**'
      - 'readme.txt'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: piwigo-display-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build-package:
    outputs:
      version: ${{ steps.version.outputs.version }}
      zip: ${{ steps.version.outputs.zip }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2

      - name: Install release verification dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Verify release source before packaging
        run: |
          composer lint
          composer security
          composer accessibility
          composer test:frontend
          composer test:package-assets
          composer compatibility
          composer standards:checked

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(php -r '$c=file_get_contents("wp-piwigo-display.php"); preg_match("/^[[:space:]]*\\*[[:space:]]*Version:[[:space:]]*([^[:space:]]+)/m", $c, $m); echo $m[1] ?? "";')"
          test -n "$VERSION"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "zip=piwigo-display-${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Prepare directly installable legacy-compatible tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build/wp-piwigo-display
          rsync -a ./ build/wp-piwigo-display/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'build' \
            --exclude '/vendor/' \
            --exclude 'tests' \
            --exclude 'composer.json' \
            --exclude 'composer.lock' \
            --exclude 'phpcs.xml.dist' \
            --exclude 'AGENTS.md' \
            --exclude 'ARCHITECTURE.md' \
            --exclude 'AUDIT.md' \
            --exclude 'CODEX.md' \
            --exclude 'ROADMAP.md' \
            --exclude 'README.en.md' \
            --exclude '*.zip'

      - name: Verify installable tree and compatibility identity
        shell: bash
        run: |
          set -euo pipefail
          ROOT=build/wp-piwigo-display
          test -f "$ROOT/wp-piwigo-display.php"
          test -f "$ROOT/assets/js/wp-piwigo-display-slider.js"
          test -f "$ROOT/assets/vendor/splide/splide.min.js"
          test -f "$ROOT/assets/vendor/splide/splide.min.css"
          grep -Fq 'Plugin Name: Piwigo Display' "$ROOT/wp-piwigo-display.php"
          grep -Fq "Text Domain: wp-piwigo-display" "$ROOT/wp-piwigo-display.php"
          grep -Fq "wp_piwigo_display_shortcode_defaults" "$ROOT/includes/class-wpd-shortcode.php"
          test "$(find build -mindepth 1 -maxdepth 1 -type d -printf '%f\n')" = 'wp-piwigo-display'
          ! find build -mindepth 1 -maxdepth 1 -type f | grep -q .

      - name: Check packaged frontend assets
        run: php tests/package-assets.php build/wp-piwigo-display

      - name: Prepare WordPress.org Plugin Check tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/plugin-check/piwigo-display
          rsync -a build/wp-piwigo-display/ build/plugin-check/piwigo-display/

      - name: Check the WordPress.org candidate without GitHub Update URI
        shell: bash
        run: |
          set -euo pipefail
          # Only the disposable Plugin Check tree is normalized. The ZIP for
          # existing GitHub users retains its isolation header.
          CHECK=build/plugin-check/piwigo-display/wp-piwigo-display.php
          sed -i '/^ \* Update URI: https:\/\/github\.com\/fr4nck\/WP-Piwigo-Display$/d' "$CHECK"
          if grep -Eq '^[[:space:]]*\*[[:space:]]*Update URI:' "$CHECK"; then
            echo "Unexpected Update URI in WordPress.org candidate" >&2
            exit 1
          fi

      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './build/plugin-check/piwigo-display'
          exclude-directories: 'vendor,tests,build'
          strict: true
          # Compatibility exceptions only: historical hooks and text domain stay unchanged.
          # The WordPress.org candidate is checked under `piwigo-display`, while the actual
          # GitHub upgrade ZIP stays rooted at `wp-piwigo-display` for existing installations.
          ignore-codes: 'WordPress.NamingConventions.PrefixAllGlobals.NonPrefixedHooknameFound,WordPress.WP.I18n.TextDomainMismatch,textdomain_mismatch'

      - name: Build directly installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd build
          zip -qr "../${{ steps.version.outputs.zip }}" wp-piwigo-display

      - name: Verify ZIP structure
        shell: bash
        run: |
          set -euo pipefail
          ZIP="${{ steps.version.outputs.zip }}"
          test -f "$ZIP"
          test "$(unzip -Z1 "$ZIP" | grep -c '^wp-piwigo-display/wp-piwigo-display.php$')" -eq 1
          test "$(unzip -Z1 "$ZIP" | grep -c '^wp-piwigo-display/assets/js/wp-piwigo-display-slider.js$')" -eq 1
          ! unzip -Z1 "$ZIP" | grep -Eq '^wp-piwigo-display/.*\.zip$'

      - name: Enregistrer la provenance du candidat
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.version.outputs.zip }}
        run: |
          set -euo pipefail
          sha256sum "$ZIP" > SHA256SUMS
          printf 'Commit: %s\nVersion: %s\nRun: %s/%s/actions/runs/%s\n' "$GITHUB_SHA" "$VERSION" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > PROVENANCE.txt

      - name: Conserver le ZIP candidat sans publication
        uses: actions/upload-artifact@v4
        with:
          name: piwigo-display-${{ github.sha }}-verification
          path: |
            ${{ steps.version.outputs.zip }}
            SHA256SUMS
            PROVENANCE.txt
          if-no-files-found: error
          retention-days: 30

      - name: Résumer la vérification
        run: echo 'ZIP de recette uniquement ; aucune release publiée par ce travail.' >> "$GITHUB_STEP_SUMMARY"

  prepare-release-draft:
    name: Préparer un brouillon pour un nouveau tag
    needs: build-package
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Récupérer le paquet vérifié
        uses: actions/download-artifact@v4
        with:
          name: piwigo-display-${{ github.sha }}-verification

      - name: Préparer le brouillon sans publier
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-package.outputs.version }}
          ZIP: ${{ needs.build-package.outputs.zip }}
        run: bash .github/scripts/prepare-release-draft.sh
