name: Build plugin ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/**'
    tags:
      - 'v*'

jobs:
  build-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          VERSION="$(php -r '$c=file_get_contents("wp-piwigo-display.php"); preg_match("/^[[:space:]]*\\*[[:space:]]*Version:[[:space:]]*([^[:space:]]+)/m", $c, $m); echo $m[1] ?? "dev";')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build WordPress plugin archive
        run: |
          git archive \
            --format=zip \
            --prefix=wp-piwigo-display/ \
            -o "piwigo-display-${{ steps.version.outputs.version }}.zip" \
            HEAD

      - name: Verify archive structure
        run: |
          unzip -l "piwigo-display-${{ steps.version.outputs.version }}.zip" | grep -q 'wp-piwigo-display/wp-piwigo-display.php'

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: piwigo-display-${{ steps.version.outputs.version }}
          path: piwigo-display-${{ steps.version.outputs.version }}.zip
          retention-days: 14
