name: Build Piwigo Display package

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/**'
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: piwigo-display-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(php -r '$c=file_get_contents("wp-piwigo-display.php"); preg_match("/^[[:space:]]*\\*[[:space:]]*Version:[[:space:]]*([^[:space:]]+)/m", $c, $m); echo $m[1] ?? "";')"
          test -n "$VERSION"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "zip=piwigo-display-${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Prepare Piwigo Display distribution
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build/piwigo-display
          rsync -a ./ build/piwigo-display/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'build' \
            --exclude '/vendor/' \
            --exclude 'tests' \
            --exclude 'composer.json' \
            --exclude 'composer.lock' \
            --exclude 'phpcs.xml.dist' \
            --exclude 'AGENTS.md' \
            --exclude 'ARCHITECTURE.md' \
            --exclude 'AUDIT.md' \
            --exclude 'CODEX.md' \
            --exclude 'ROADMAP.md' \
            --exclude '*.zip'

          mv build/piwigo-display/wp-piwigo-display.php build/piwigo-display/piwigo-display.php

          while IFS= read -r -d '' path; do
            dir="$(dirname "$path")"
            base="$(basename "$path")"
            mv "$path" "$dir/${base/wp-piwigo-display/piwigo-display}"
          done < <(find build/piwigo-display/assets -type f -name '*wp-piwigo-display*' -print0)

          python3 - <<'PY'
          from pathlib import Path

          root = Path('build/piwigo-display')
          allowed = {'.php', '.js', '.json', '.css', '.txt', '.md'}
          replacements = (
              ('wp-piwigo-display', 'piwigo-display'),
              ('WP_Piwigo_Display', 'Piwigo_Display'),
              ('wp_piwigo_display', 'piwigo_display'),
              ('WP-Piwigo-Display', 'Piwigo-Display'),
          )
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in allowed:
                  continue
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Verify installable tree
        shell: bash
        run: |
          set -euo pipefail
          test -f build/piwigo-display/piwigo-display.php
          test -f build/piwigo-display/assets/js/piwigo-display-slider.js
          test -f build/piwigo-display/assets/vendor/splide/splide.min.js
          test -f build/piwigo-display/assets/vendor/splide/splide.min.css
          ! find build/piwigo-display -type f -name '*wp-piwigo-display*' | grep -q .
          ! grep -RIlE 'wp-piwigo-display|WP_Piwigo_Display|wp_piwigo_display' build/piwigo-display | grep -q .
          test "$(find build -mindepth 1 -maxdepth 1 -type d -printf '%f\n')" = 'piwigo-display'
          ! find build -mindepth 1 -maxdepth 1 -type f | grep -q .

      - name: Build directly installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd build
          zip -qr "../${{ steps.version.outputs.zip }}" piwigo-display

      - name: Verify ZIP structure
        shell: bash
        run: |
          set -euo pipefail
          ZIP="${{ steps.version.outputs.zip }}"
          test -f "$ZIP"
          test "$(unzip -Z1 "$ZIP" | grep -c '^piwigo-display/piwigo-display.php$')" -eq 1
          test "$(unzip -Z1 "$ZIP" | grep -c '^piwigo-display/assets/js/piwigo-display-slider.js$')" -eq 1
          ! unzip -Z1 "$ZIP" | grep -q 'wp-piwigo-display'
          ! unzip -Z1 "$ZIP" | grep -Eq '^piwigo-display/.*\.zip$'

      - name: Publish package in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.version.outputs.zip }}
        shell: bash
        run: |
          set -euo pipefail

          prerelease_args=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" \
              --target "$GITHUB_SHA" \
              --title "Piwigo Display ${VERSION}" \
              --notes "Paquet directement installable dans WordPress : ${ZIP}" \
              "${prerelease_args[@]}"
          fi

      - name: Verify published release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ZIP: ${{ steps.version.outputs.zip }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$ZIP"

      - name: Summary
        shell: bash
        run: |
          echo "### Piwigo Display ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Package publié dans **GitHub Releases** : \`${{ steps.version.outputs.zip }}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Ce ZIP est directement installable dans WordPress. Aucun passage par Artifacts n'est nécessaire." >> "$GITHUB_STEP_SUMMARY"
