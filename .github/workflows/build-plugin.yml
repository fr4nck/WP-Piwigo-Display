name: Build Piwigo Display ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/**'
    tags:
      - 'v*'

jobs:
  build-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          VERSION="$(php -r '$c=file_get_contents("wp-piwigo-display.php"); preg_match("/^[[:space:]]*\\*[[:space:]]*Version:[[:space:]]*([^[:space:]]+)/m", $c, $m); echo $m[1] ?? "dev";')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Prepare Piwigo Display distribution
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/piwigo-display
          mkdir -p build/piwigo-display
          rsync -a ./ build/piwigo-display/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'build' \
            --exclude '/vendor/' \
            --exclude 'tests' \
            --exclude 'composer.json' \
            --exclude 'composer.lock' \
            --exclude 'phpcs.xml.dist' \
            --exclude 'AGENTS.md' \
            --exclude 'ARCHITECTURE.md' \
            --exclude 'AUDIT.md' \
            --exclude 'CODEX.md' \
            --exclude 'ROADMAP.md' \
            --exclude '*.zip'

          # Public plugin entry point: no legacy WP prefix.
          mv build/piwigo-display/wp-piwigo-display.php build/piwigo-display/piwigo-display.php

          # Public asset filenames: no legacy WP prefix.
          while IFS= read -r -d '' path; do
            dir="$(dirname "$path")"
            base="$(basename "$path")"
            mv "$path" "$dir/${base/wp-piwigo-display/piwigo-display}"
          done < <(find build/piwigo-display/assets -type f -name '*wp-piwigo-display*' -print0)

          # Public identifiers and references: use Piwigo Display consistently.
          python3 - <<'PY'
          from pathlib import Path

          root = Path('build/piwigo-display')
          allowed = {'.php', '.js', '.json', '.css', '.txt', '.md'}
          replacements = (
              ('wp-piwigo-display', 'piwigo-display'),
              ('WP_Piwigo_Display', 'Piwigo_Display'),
              ('wp_piwigo_display', 'piwigo_display'),
              ('WP-Piwigo-Display', 'Piwigo-Display'),
          )
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in allowed:
                  continue
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Verify distribution contents
        shell: bash
        run: |
          set -euo pipefail
          test -f build/piwigo-display/piwigo-display.php
          test -f build/piwigo-display/assets/js/piwigo-display-slider.js
          test -f build/piwigo-display/assets/vendor/splide/splide.min.js
          test -f build/piwigo-display/assets/vendor/splide/splide.min.css
          ! find build/piwigo-display -type f -name '*wp-piwigo-display*' | grep -q .
          ! grep -RIlE 'wp-piwigo-display|WP_Piwigo_Display|wp_piwigo_display' build/piwigo-display | grep -q .

      - name: Build Piwigo Display archive
        shell: bash
        run: |
          cd build
          zip -qr "../piwigo-display-${{ steps.version.outputs.version }}.zip" piwigo-display

      - name: Verify archive structure
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="piwigo-display-${{ steps.version.outputs.version }}.zip"
          unzip -l "$ARCHIVE" | grep -q 'piwigo-display/piwigo-display.php'
          unzip -l "$ARCHIVE" | grep -q 'piwigo-display/assets/js/piwigo-display-slider.js'
          unzip -l "$ARCHIVE" | grep -q 'piwigo-display/assets/vendor/splide/splide.min.js'
          unzip -l "$ARCHIVE" | grep -q 'piwigo-display/assets/vendor/splide/splide.min.css'
          ! unzip -l "$ARCHIVE" | grep -q 'wp-piwigo-display'

      - name: Upload Piwigo Display ZIP
        uses: actions/upload-artifact@v4
        with:
          name: piwigo-display-${{ steps.version.outputs.version }}
          path: piwigo-display-${{ steps.version.outputs.version }}.zip
          retention-days: 14
