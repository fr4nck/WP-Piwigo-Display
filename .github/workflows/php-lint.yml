name: Plugin CI

on:
  pull_request:
  push:
    branches:
      - main
      - '3.x-dev'
      - '3.1.x-dev'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: plugin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests PHP et frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2

      - name: Install test dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check PHP 8.1 syntax
        run: composer lint

      - name: Check security invariants
        run: composer security

      - name: Check accessibility invariants
        run: composer accessibility

      - name: Check frontend rendering resilience
        run: composer test:frontend

      - name: Check registered frontend assets
        run: composer test:package-assets

  standards:
    name: Standards et compatibilité
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2

      - name: Install quality dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check PHP compatibility
        run: composer compatibility

      - name: Check normalized WordPress files
        run: composer standards:checked

      - name: Audit historical test-suite WPCS debt
        continue-on-error: true
        run: composer standards:report

      - name: Configure PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Check PHP 8.4 syntax
        run: composer lint

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Plugin Check distribution
        run: |
          mkdir -p build/plugin-check/piwigo-display
          rsync -a ./ build/plugin-check/piwigo-display/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'build' \
            --exclude 'vendor' \
            --exclude 'tests' \
            --exclude 'composer.json' \
            --exclude 'composer.lock' \
            --exclude 'phpcs.xml.dist' \
            --exclude 'AGENTS.md' \
            --exclude 'ROADMAP.md' \
            --exclude 'ARCHITECTURE.md' \
            --exclude 'AUDIT.md' \
            --exclude 'CODEX.md' \
            --exclude 'README.en.md' \
            --exclude '*.zip'
          python3 - <<'PY'
          from pathlib import Path

          root = Path('build/plugin-check/piwigo-display')
          allowed = {'.php', '.js', '.json', '.txt', '.md'}
          for path in root.rglob('*'):
              if path.is_file() and path.suffix.lower() in allowed:
                  text = path.read_text(encoding='utf-8')
                  updated = text.replace('wp-piwigo-display', 'piwigo-display')
                  if updated != text:
                      path.write_text(updated, encoding='utf-8')
          PY

      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './build/plugin-check/piwigo-display'
          exclude-directories: 'vendor,tests,build'
          strict: true
          # Three historical public hooks keep their pre-v3 names for backward compatibility.
          ignore-codes: 'WordPress.NamingConventions.PrefixAllGlobals.NonPrefixedHooknameFound'

  package:
    name: Paquet ZIP
    needs:
      - tests
      - standards
      - plugin-check
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/3.x-dev' || github.ref == 'refs/heads/3.1.x-dev' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          VERSION=$(php -r '$c=file_get_contents("wp-piwigo-display.php"); preg_match("/Version:\\s*([^\\r\\n]+)/", $c, $m); echo trim($m[1] ?? "dev");')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare plugin directory
        run: |
          mkdir -p build/piwigo-display
          rsync -a ./ build/piwigo-display/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'build' \
            --exclude 'vendor' \
            --exclude 'tests' \
            --exclude 'composer.json' \
            --exclude 'composer.lock' \
            --exclude 'phpcs.xml.dist' \
            --exclude 'AGENTS.md' \
            --exclude 'ROADMAP.md' \
            --exclude 'ARCHITECTURE.md' \
            --exclude 'AUDIT.md' \
            --exclude 'CODEX.md' \
            --exclude 'README.en.md' \
            --exclude '*.zip'

      - name: Check packaged frontend assets
        run: php tests/package-assets.php build/piwigo-display

      - name: Create ZIP
        run: |
          cd build
          zip -r "piwigo-display-${{ steps.version.outputs.version }}.zip" piwigo-display

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: piwigo-display-${{ steps.version.outputs.version }}
          path: build/piwigo-display-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 7
