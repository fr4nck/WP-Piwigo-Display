name: Plugin CI

on:
  pull_request:
  push:
    branches:
      - main
      - '3.x-dev'
      - 'audit/**'
      - 'release/3.0.0-rc.3'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: plugin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualité PHP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install quality dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check PHP 8.1 syntax
        run: composer lint

      - name: Check security invariants
        run: composer security

      - name: Check accessibility invariants
        run: composer accessibility

      - name: Check frontend rendering resilience
        run: composer test:frontend

      - name: Check registered frontend assets
        run: composer test:package-assets

      - name: Check PHP compatibility
        run: composer compatibility

      - name: Check normalized WordPress files
        run: composer standards:checked

      - name: Audit remaining WordPress Coding Standards
        continue-on-error: true
        run: composer standards:report

      - name: Prepare WordPress.org Plugin Check distribution
        run: |
          mkdir -p build/plugin-check/piwigo-display
          rsync -a ./ build/plugin-check/piwigo-display/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'build' \
            --exclude '/vendor/' \
            --exclude 'tests' \
            --exclude 'composer.json' \
            --exclude 'composer.lock' \
            --exclude 'phpcs.xml.dist' \
            --exclude 'AGENTS.md' \
            --exclude 'ROADMAP.md' \
            --exclude 'ARCHITECTURE.md' \
            --exclude 'AUDIT.md' \
            --exclude 'CODEX.md' \
            --exclude 'README.en.md' \
            --exclude '*.zip'

      - name: Check the WordPress.org candidate without GitHub Update URI
        shell: bash
        run: |
          set -euo pipefail
          # This is only the disposable WordPress.org check tree. Never rewrite
          # the GitHub package or its Update URI header in the source.
          CHECK=build/plugin-check/piwigo-display/wp-piwigo-display.php
          sed -i '/^ \* Update URI: https:\/\/github\.com\/fr4nck\/WP-Piwigo-Display$/d' "$CHECK"
          if grep -Eq '^[[:space:]]*\*[[:space:]]*Update URI:' "$CHECK"; then
            echo "Unexpected Update URI in WordPress.org candidate" >&2
            exit 1
          fi
          grep -Fq ' * Update URI: https://github.com/fr4nck/WP-Piwigo-Display' wp-piwigo-display.php

      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './build/plugin-check/piwigo-display'
          exclude-directories: 'vendor,tests,build'
          strict: true
          # Compatibility exceptions only: the historical public hooks and text domain
          # stay unchanged so existing integrations/translations keep working. The public
          # product name and WordPress.org candidate slug are both `Piwigo Display` / `piwigo-display`.
          ignore-codes: 'WordPress.NamingConventions.PrefixAllGlobals.NonPrefixedHooknameFound,WordPress.WP.I18n.TextDomainMismatch,textdomain_mismatch'

      - name: Configure PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Check PHP 8.4 syntax
        run: composer lint

  package:
    name: Paquet ZIP
    needs: quality
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/3.x-dev' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          VERSION=$(php -r '$c=file_get_contents("wp-piwigo-display.php"); preg_match("/Version:\\s*([^\\r\\n]+)/", $c, $m); echo trim($m[1] ?? "dev");')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare plugin directory
        run: |
          mkdir -p build/wp-piwigo-display
          rsync -a ./ build/wp-piwigo-display/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'build' \
            --exclude '/vendor/' \
            --exclude 'tests' \
            --exclude 'composer.json' \
            --exclude 'composer.lock' \
            --exclude 'phpcs.xml.dist' \
            --exclude 'AGENTS.md' \
            --exclude 'ROADMAP.md' \
            --exclude 'ARCHITECTURE.md' \
            --exclude 'AUDIT.md' \
            --exclude 'CODEX.md' \
            --exclude 'README.en.md' \
            --exclude '*.zip'

      - name: Check packaged frontend assets
        run: php tests/package-assets.php build/wp-piwigo-display

      - name: Create ZIP
        run: |
          cd build
          zip -r "piwigo-display-${{ steps.version.outputs.version }}.zip" wp-piwigo-display

      - name: Verify ZIP and record provenance
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd build
          ZIP="piwigo-display-${VERSION}.zip"
          unzip -tq "$ZIP"
          test "$(unzip -Z1 "$ZIP" | cut -d/ -f1 | sort -u)" = 'wp-piwigo-display'
          unzip -Z1 "$ZIP" | grep -x 'wp-piwigo-display/wp-piwigo-display.php' > /dev/null
          unzip -p "$ZIP" wp-piwigo-display/wp-piwigo-display.php | grep -E "^ \* Version: ${VERSION}\$" > /dev/null
          if unzip -Z1 "$ZIP" | grep -E '^wp-piwigo-display/(\.github|tests|vendor|node_modules)/|(^|/)\.git/|\.zip$'; then
            echo 'Fichiers indésirables dans le ZIP.' >&2
            exit 1
          fi
          sha256sum "$ZIP" > SHA256SUMS
          printf 'Commit: %s\nVersion: %s\nRun: %s/%s/actions/runs/%s\n' "$GITHUB_SHA" "$VERSION" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > PROVENANCE.txt
          cat SHA256SUMS PROVENANCE.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: piwigo-display-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            build/piwigo-display-${{ steps.version.outputs.version }}.zip
            build/SHA256SUMS
            build/PROVENANCE.txt
          if-no-files-found: error
          retention-days: 30
