name: Plugin CI

on:
  pull_request:
  push:
    branches:
      - main
      - '2.0.x'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualité PHP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install quality dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check PHP 8.1 syntax
        run: composer lint

      - name: Check PHP compatibility
        run: composer compatibility

      - name: Check normalized WordPress files
        run: composer standards:checked

      - name: Audit remaining WordPress Coding Standards
        continue-on-error: true
        run: composer standards:report

      - name: Configure PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Check PHP 8.4 syntax
        run: composer lint

  package:
    name: Paquet ZIP
    needs: quality
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          VERSION=$(php -r '$c=file_get_contents("wp-piwigo-display.php"); preg_match("/Version:\\s*([^\\r\\n]+)/", $c, $m); echo trim($m[1] ?? "dev");')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare plugin directory
        run: |
          mkdir -p build/wp-piwigo-display
          rsync -a ./ build/wp-piwigo-display/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'build' \
            --exclude 'vendor' \
            --exclude 'composer.lock' \
            --exclude '*.zip'

      - name: Create ZIP
        run: |
          cd build
          zip -r "wp-piwigo-display-${{ steps.version.outputs.version }}.zip" wp-piwigo-display

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wp-piwigo-display-${{ steps.version.outputs.version }}
          path: build/wp-piwigo-display-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 7
