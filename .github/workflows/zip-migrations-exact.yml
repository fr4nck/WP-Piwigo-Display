      WPD_PIWIGO_TAG: ${{ matrix.piwigo }}
      WPD_MARIADB_TAG: ${{ matrix.mariadb }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Assert exact source and record verifier identity
