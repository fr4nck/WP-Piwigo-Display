name: Gutenberg et Piwigo RC3 - SHA exact - verification seule

on:
  push:
    branches:
      - 'verification/real-zip-migrations-20261117-b9e817-44470a'

permissions:
  contents: read

concurrency:
  group: rc3-editor-exact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-editor-security:
    name: ${{ matrix.line }} Gutenberg DOM and private homonyms / Piwigo ${{ matrix.piwigo }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - line: RC3
            source_sha: 'a6af5b6e752e879a6a5972fb3cd3ab8291841614'
            piwigo: '16.2.0'
            mariadb: '10.6'
          - line: RC3
            source_sha: 'a6af5b6e752e879a6a5972fb3cd3ab8291841614'
            piwigo: '16.4.0'
            mariadb: '11.4'
    env:
      SOURCE_SHA: ${{ matrix.source_sha }}
      VERIFICATION_MODE: verify-only
      WPD_PIWIGO_TAG: ${{ matrix.piwigo }}
      WPD_MARIADB_TAG: ${{ matrix.mariadb }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Assert exact source and record verifier identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf 'TESTED_SOURCE_SHA=%s\nVERIFIER_WORKFLOW_SHA=%s\nVERIFICATION_MODE=verify-only\n' "$SOURCE_SHA" "$GITHUB_SHA"
      - name: Configure PHP for disposable WordPress
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: mysqli, gd, mbstring, curl, xml, zip
          coverage: none
      - name: Install pinned browser test engine
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check focused test syntax
        run: |
          bash -n tests/e2e/editor-security-start.sh
          node --check tests/e2e/editor-security-browser.cjs
          php -l tests/e2e/editor-security-fixture.php
          php -l tests/e2e/editor-security-piwigo.php
          php tests/album-picker-nonce.php
      - name: Start disposable WordPress and real Piwigo homonyms
        run: bash tests/e2e/editor-security-start.sh
      - name: Real service account and homonyms - cold and persistent hot cache
        run: |
          set -Eeuo pipefail
          php "$WPD_LAB/wp-cli.phar" --path="$WPD_LAB/wordpress" --allow-root \
            eval 'WPD_Cache::clear_all();'
          for phase in cold persistent-hot; do
            echo "REAL_HOMONYM_CACHE_PHASE=$phase"
            php "$WPD_LAB/wp-cli.phar" --path="$WPD_LAB/wordpress" --allow-root \
              eval-file tests/e2e/editor-security-piwigo.php
          done
      - name: Real Gutenberg DOM, expired nonce and anonymous/private rendering
        run: node tests/e2e/editor-security-browser.cjs
      - name: Confirm exact source recipe completion
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf 'EXACT_SHA_EDITOR_SECURITY=PASS source=%s piwigo=%s\n' "$SOURCE_SHA" "${{ matrix.piwigo }}"
      - name: Show focused failure diagnostics as text
        if: failure()
        run: |
          LAB="$RUNNER_TEMP/piwigo-editor-security"
          if [ -f "$LAB/wp-server.log" ]; then tail -n 60 "$LAB/wp-server.log"; fi
          if [ -f "$LAB/proxy.log" ]; then tail -n 20 "$LAB/proxy.log"; fi
      - name: Tear down disposable services
        if: always()
        run: |
          set +e
          LAB="$RUNNER_TEMP/piwigo-editor-security"
          for name in wp-server proxy; do
            if [ -f "$LAB/$name.pid" ]; then kill "$(cat "$LAB/$name.pid")" 2>/dev/null; fi
          done
          docker rm -f wpd-310-piwigo wpd-310-db 2>/dev/null
          docker network rm wpd-310-e2e 2>/dev/null
          echo 'EDITOR_SECURITY_LAB_STOPPED=YES'
