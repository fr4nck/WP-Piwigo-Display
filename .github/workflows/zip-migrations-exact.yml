  verify-editor-security:
    name: ${{ matrix.line }} Gutenberg DOM and private homonyms / Piwigo ${{ matrix.piwigo }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - line: RC3
            source_sha: 'b9e81770e8b519f88d87411430cac7d7291a6953'
            piwigo: '16.2.0'
            mariadb: '10.6'
          - line: RC3
            source_sha: 'b9e81770e8b519f88d87411430cac7d7291a6953'
            piwigo: '16.4.0'
            mariadb: '11.4'
