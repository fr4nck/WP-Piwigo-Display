name: Final settings WPCS fix

on:
  push:
    branches:
      - refactor/wpcs-settings
    paths:
      - .github/workflows/wpcs-settings-last-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/wpcs-settings
          fetch-depth: 0

      - name: Apply final documentation and nonce annotation fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('includes/class-wpd-settings.php')
          text = path.read_text()
          text = text.replace('@param string $class CSS class.', '@param string $css_class CSS class.')
          text = text.replace('@param string $default Fallback value.', '@param string $fallback Fallback value.')
          target = "absint( wp_unslash( $_GET['wpd_cache_cleared'] ) )"
          replacement = "// phpcs:ignore WordPress.Security.NonceVerification.Recommended -- Status value comes from an internal admin redirect.\n\t\t\t\t\t\t\t" + target
          if replacement not in text:
              text = text.replace(target, replacement)
          path.write_text(text)
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/wpcs-settings-last-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/class-wpd-settings.php .github/workflows/wpcs-settings-last-fix.yml
          git commit -m "style: resolve final settings WPCS findings"
          git push origin HEAD:refactor/wpcs-settings
